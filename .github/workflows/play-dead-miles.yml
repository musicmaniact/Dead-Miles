
name: Publish Playable Dead Miles

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Download Dead Miles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p game
          gh release download v5.9.5 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'DeadMiles_595_Last_Departure_Android.zip'
          unzip -q DeadMiles_595_Last_Departure_Android.zip -d game
          test -f game/project.godot

      - name: Build browser game
        run: |
          printf '[preset.0]\nname="Web"\nplatform="Web"\nrunnable=true\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\n\n[preset.0.options]\nvariant/thread_support=false\n' > game/export_presets.cfg

          godot --headless --path game --editor --import --quit

          mkdir -p site
          godot --headless --path game \
            --export-release Web "$GITHUB_WORKSPACE/site/index.html"

          test -s site/index.html
          test -s site/index.wasm
          test -s site/index.pck
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
